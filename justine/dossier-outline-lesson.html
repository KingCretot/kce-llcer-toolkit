<script>
(function(){
var Q="To what extent can we shape the self we show to others when family and society expect something else?";
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function rev(btn,html,cls){return '<button class="rev" type="button">'+btn+'</button><div class="ans'+(cls?' '+cls:'')+'">'+html+'</div>'}
var ROWS=[['q','Thème du dossier / Problématique'],['o','Opening'],['p1','Part I'],['p2','Part II'],['lk','Links'],['cl','Closing'],['ky','Key words']];
var LINES={
 q:{sec:'q',o:1,h:Q},
 o1:{sec:'o',o:1,h:'<b>Hook:</b> In the mirror, Rockwell’s glasses hide his eyes, but on the canvas his eyes are clear.'},
 o2:{sec:'o',o:2,h:'<b>Theme and question:</b> expression et construction de soi. “'+Q+'”'},
 o3:{sec:'o',o:3,h:'<b>Roadmap:</b> four documents (<i>Brooklyn</i>, “Eveline”, <i>Triple Self-Portrait</i>, “Boys Don’t Cry”) in two parts: I. expectations push us to hide or to stay; II. we can still shape what we show.'},
 p1t:{sec:'p1',o:0,h:'<b class="pt">I. Family and society push us to hide or to stay</b>'},
 p1a:{sec:'p1',o:1,h:'<b>“Eveline”</b>: duty to her family keeps her at home. She cannot say what she wants, so she stays.'},
 p1b:{sec:'p1',o:2,h:'<b>“Boys Don’t Cry”</b>: a man hides his sadness behind laughter, because boys are expected not to cry.'},
 p1c:{sec:'p1',o:3,h:'<b>Brooklyn (start)</b>: Rose and Father Flood arrange Eilis’s move. She is directed by others and often stays silent.'},
 p2t:{sec:'p2',o:0,h:'<b class="pt">II. Still, we can shape the self we show</b>'},
 p2a:{sec:'p2',o:1,h:'<b>Brooklyn (later)</b>: she controls what each person knows (the secret marriage) until Miss Kelly forces the truth out. Then she acts: she tells her mother, leaves a note for Jim, and goes back.'},
 p2b:{sec:'p2',o:2,h:'<b>Triple Self-Portrait</b>: Rockwell constructs the image he shows (on the canvas his eyes are clear), but we never see his real face straight on. Which of the three selves is real?'},
 lk1:{sec:'lk',o:1,h:'<b>“Eveline” ↔ <i>Brooklyn</i></b>: same situation (leaving home for a new life), opposite outcome.'},
 lk2:{sec:'lk',o:2,h:'<b><i>Brooklyn</i> ↔ Rockwell</b>: both choose what others see. Eilis chooses what each person knows; Rockwell shows three selves, so which one is real?'},
 cl1:{sec:'cl',o:1,h:'To a large extent we can shape the self we show: Eilis takes control step by step, and Rockwell constructs the image he shows. But never completely: duty keeps Eveline at home, a man is told not to cry, and even in Rockwell’s painting we never see his real face straight on. The real self may stay hidden.'},
 ky:{sec:'ky',o:1,h:'duty · stays · laughter · Rose · Father Flood · secret marriage · goes back · mirror · canvas · glasses · three selves'}
};
var state={};
var flashSec='',curHot='';
function draw(){
 var box=document.getElementById('rows');box.innerHTML='';
 ROWS.forEach(function(r){
  var ids=Object.keys(state).filter(function(k){return LINES[k].sec===r[0]}).sort(function(a,b){return LINES[a].o-LINES[b].o});
  var row=document.createElement('div');row.className='cr'+(flashSec===r[0]?' flash':'')+(curHot===r[0]?' hot':'');row.setAttribute('data-r',r[0]);
  var inner='';
  if(!ids.length)inner='<span class="ph">…</span>';
  ids.forEach(function(k){inner+='<div class="li"><span contenteditable="true" data-id="'+k+'">'+state[k]+'</span></div>'});
  row.innerHTML='<div class="cl">'+r[1]+'</div><div class="cv'+(r[0]==='q'?' q2':'')+'">'+inner+'</div>';
  box.appendChild(row);
 });
 flashSec='';
}
